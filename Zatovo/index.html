<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Lesona Zatovo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: transparent; /* Transparent for Android WebView */
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 100%;
            min-height: 100vh;
            padding: 16px 16px 80px; /* Reduced padding since header removed */
        }
        
        .header {
            padding: 32px 0 24px;
            text-align: center;
        }
        
        .main-title {
            font-size: 22px;
            font-weight: 700;
            font-family: 'Lora', serif;
            color: #8B4513; /* Brown color */
            letter-spacing: 0.5px;
            line-height: 1.3;
            margin-bottom: 0;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 14px;
            color: #888888;
            font-weight: 400;
            margin-top: 8px;
        }
        
        .intro-section {
            margin: 24px 0 32px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.08); /* Semi-transparent white */
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .intro-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .intro-link:active {
            transform: scale(0.98);
            opacity: 0.7;
        }
        
        .intro-content {
            flex: 1;
        }
        
        .intro-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        .intro-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            font-family: 'Lora', serif;
            letter-spacing: 0.3px;
            line-height: 1.4;
        }
        
        .section-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5); /* Better contrast */
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 32px 0 16px;
            font-weight: 600;
        }
        
        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Better spacing */
        }
        
        .lesson-item {
            background: rgba(255, 255, 255, 0.05); /* Semi-transparent */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px; /* More rounded */
            padding: 16px 18px; /* Better padding */
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        
        .lesson-item:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .lesson-item.disabled {
            opacity: 0.35;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.02);
        }
        
        .lesson-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }
        
        .lesson-number {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.95); /* Brighter white */
            color: #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); /* Subtle shadow */
        }
        
        .lesson-item.disabled .lesson-number {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            box-shadow: none;
        }
        
        .lesson-title {
            font-size: 16px;
            font-weight: 600;
            color: #8B4513; /* Brown color for lesson titles */
            font-family: 'Lora', serif;
            letter-spacing: 0.3px;
            line-height: 1.4;
            display: block; /* Ensure it displays */
        }
        
        .lesson-item.disabled .lesson-title {
            color: rgba(139, 69, 19, 0.3); /* Brown with low opacity */
            font-style: italic;
        }
        
        .chevron {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            opacity: 0.5;
        }
        
        .intro-icon {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            opacity: 0.8;
        }
        
        @media (max-width: 375px) {
            .container {
                padding: 16px 12px 60px;
            }
            
            .header {
                padding: 40px 0 24px;
            }
            
            .main-title {
                font-size: 23px;
            }
            
            .intro-section {
                padding: 16px;
            }
            
            .lesson-item {
                padding: 14px;
            }
            
            .lesson-number {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            
            .lesson-title {
                font-size: 15px;
            }
        }
        
        @media (min-width: 768px) {
            .container {
                max-width: 480px;
                margin: 0 auto;
            }
        }
    </style>
</head>
