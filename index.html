<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Lesona SDA</title>
    
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <link rel="apple-touch-icon" href="images/icon-512.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Lora', serif;
            background: #000000;
            color: #ffffff;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .content {
            flex: 1;
            padding: 110px 16px 32px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .lesson-card {
            background: #000000;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px;
            text-decoration: none;
            transition: transform 0.15s ease, opacity 0.15s ease;
            cursor: pointer;
            position: relative;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
        }

        .lesson-card:active {
            transform: scale(0.97);
            opacity: 0.6;
        }

        .lesson-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            flex-shrink: 0;
            background: #111111;
            border-radius: 16px;
        }

        .lesson-info {
            flex: 1;
            min-width: 0;
        }

        .lesson-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.3;
            font-family: 'Lora', serif;
        }

        .lesson-arrow {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            opacity: 0.4;
        }

        #iframe-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 9999;
        }

        #iframe-container.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px;
            text-align: center;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-overlay h2 {
            font-size: 24px;
            margin-bottom: 16px;
        }

        .loading-overlay p {
            opacity: 0.7;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 375px) {
            .content {
                padding: 100px 12px 28px;
            }

            .lesson-card {
                padding: 14px;
                gap: 16px;
            }

            .lesson-image {
                width: 104px;
                height: 104px;
                border-radius: 14px;
            }

            .lesson-title {
                font-size: 19px;
            }
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 480px;
                margin: 0 auto;
            }
        }

        .install-prompt {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #1a1a1a;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 1000;
            border: 1px solid #333;
        }

        .install-prompt.show {
            display: block;
        }

        .install-prompt h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .install-prompt p {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 12px;
        }

        .install-buttons {
            display: flex;
            gap: 8px;
        }

        .install-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-install {
            background: #4CAF50;
            color: white;
        }

        .btn-dismiss {
            background: #333;
            color: white;
        }

        .update-notification {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: #1a1a1a;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 1000;
            border: 1px solid #2196F3;
        }

        .update-notification.show {
            display: block;
        }

        .update-notification h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .update-notification p {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 12px;
        }

        .update-notification button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            background: #2196F3;
            color: white;
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <h2>📚 Manomana...</h2>
        <p id="loadingText">Manokatra ny lesona...</p>
        <div class="spinner"></div>
    </div>

    <div class="app-container" id="menu">
        <div class="content">
            <div class="lessons-list">
                <a href="https://sabbath-school.adventech.io/resources/mg/ss/2025-04" class="lesson-card" data-lesson="lehibe">
                    <img src="images/lehibe.png" alt="LEHIBE" class="lesson-image">
                    <div class="lesson-info">
                        <div class="lesson-title">LEHIBE</div>
                    </div>
                    <svg class="lesson-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L15 12L9 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>

                <a href="https://sabbath-school.adventech.io/resources/mg/ss/2025-04-cq" class="lesson-card" data-lesson="tanora">
                    <img src="images/tanora.png" alt="TANORA ZOKINY" class="lesson-image">
                    <div class="lesson-info">
                        <div class="lesson-title">TANORA ZOKINY</div>
                    </div>
                    <svg class="lesson-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L15 12L9 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>

                <a href="https://AndilanaSudLesona.github.io/SDA/Zatovo/" class="lesson-card" data-lesson="zatovo">
                    <img src="images/zatovo.png" alt="ZATOVO" class="lesson-image">
                    <div class="lesson-info">
                        <div class="lesson-title">ZATOVO</div>
                    </div>
                    <svg class="lesson-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L15 12L9 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <div id="iframe-container">
        <iframe id="lesson-iframe" src=""></iframe>
    </div>

    <div class="install-prompt" id="installPrompt">
        <h3>📱 Installer Lesona</h3>
        <p>Installer l'application mba hahafahana mampiasa offline tsara kokoa</p>
        <div class="install-buttons">
            <button class="btn-install" id="btnInstall">Installer</button>
            <button class="btn-dismiss" id="btnDismiss">Aoriana</button>
        </div>
    </div>

    <div class="update-notification" id="updateNotification">
        <h3>🔄 Mise à jour disponible</h3>
        <p>Misy version vaovao. Cliquer mba hanovana izao.</p>
        <button id="btnUpdate">Mettre à jour</button>
    </div>

    <script>
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const cards = document.querySelectorAll('.lesson-card');
        
        let swRegistration = null;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                try {
                    swRegistration = await navigator.serviceWorker.register('/service-worker.js');
                    console.log('✓ Service Worker enregistré');

                    checkForUpdates();

                    navigator.serviceWorker.addEventListener('message', (event) => {
                        if (event.data && event.data.action === 'cached') {
                            console.log('✓ Ressource mise en cache');
                        }
                    });

                } catch (error) {
                    console.error('✗ Erreur Service Worker:', error);
                }
            });
        }

        function checkForUpdates() {
            if (!swRegistration) return;

            swRegistration.addEventListener('updatefound', () => {
                const newWorker = swRegistration.installing;
                
                newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        showUpdateNotification();
                    }
                });
            });
        }

        function showUpdateNotification() {
            const updateNotification = document.getElementById('updateNotification');
            const btnUpdate = document.getElementById('btnUpdate');
            
            updateNotification.classList.add('show');
            
            btnUpdate.addEventListener('click', () => {
                if (swRegistration && swRegistration.waiting) {
                    swRegistration.waiting.postMessage({ action: 'skipWaiting' });
                }
                window.location.reload();
            });
        }

        let deferredPrompt;
        const installPrompt = document.getElementById('installPrompt');
        const btnInstall = document.getElementById('btnInstall');
        const btnDismiss = document.getElementById('btnDismiss');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            setTimeout(() => {
                if (!localStorage.getItem('installDismissed')) {
                    installPrompt.classList.add('show');
                }
            }, 5000);
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            }
            installPrompt.classList.remove('show');
        });

        btnDismiss.addEventListener('click', () => {
            localStorage.setItem('installDismissed', 'true');
            installPrompt.classList.remove('show');
        });

        const iframeContainer = document.getElementById('iframe-container');
        const iframe = document.getElementById('lesson-iframe');
        const menu = document.getElementById('menu');
        
        cards.forEach(card => {
            card.addEventListener('click', async function(e) {
                e.preventDefault();
                const url = this.getAttribute('href');
                const lessonKey = 'lesson_visited_' + this.dataset.lesson;
                
                loadingOverlay.classList.add('active');
                loadingText.textContent = 'Manokatra ny lesona...';
                
                iframe.src = url;
                
                localStorage.setItem(lessonKey, 'true');
                
                setTimeout(() => {
                    loadingOverlay.classList.remove('active');
                    iframeContainer.classList.add('active');
                    menu.style.display = 'none';
                    history.pushState({page: 'lesson'}, '', '#lesson');
                }, 1500);
            });
        });
        
        window.addEventListener('popstate', function() {
            if (iframeContainer.classList.contains('active')) {
                iframeContainer.classList.remove('active');
                menu.style.display = 'block';
                iframe.src = '';
            }
        });

        window.addEventListener('beforeunload', () => {
            if (iframe.src) {
                const currentCard = Array.from(cards).find(card => 
                    iframe.src.startsWith(card.getAttribute('href'))
                );
                if (currentCard) {
                    const lessonKey = 'lesson_visited_' + currentCard.dataset.lesson;
                    localStorage.setItem(lessonKey, 'true');
                }
            }
        });
    </script>
</body>
    </html>
