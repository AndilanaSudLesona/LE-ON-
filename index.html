<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Lesona</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 56px 24px 32px;
            background: #000000;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo {
            width: 40px;
            height: 40px;
        }

        .app-title {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .app-subtitle {
            font-size: 15px;
            font-weight: 400;
            color: #888888;
            margin-top: 4px;
            letter-spacing: -0.2px;
        }

        /* Content */
        .content {
            flex: 1;
            padding: 0 16px 32px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #666666;
            padding: 0 8px 12px;
        }

        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lesson-card {
            background: #ffffff;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            text-decoration: none;
            transition: transform 0.15s ease, opacity 0.15s ease;
            cursor: pointer;
        }

        .lesson-card:active {
            transform: scale(0.98);
            opacity: 0.7;
        }

        .lesson-image {
            width: 88px;
            height: 88px;
            object-fit: cover;
            flex-shrink: 0;
            background: #f0f0f0;
        }

        .lesson-info {
            flex: 1;
            min-width: 0;
        }

        .lesson-title {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
            line-height: 1.3;
        }

        .lesson-subtitle {
            font-size: 13px;
            color: #666666;
            font-weight: 400;
            letter-spacing: -0.1px;
        }

        .lesson-arrow {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            opacity: 0.3;
        }

        /* Iframe Container */
        #iframe-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 9999;
        }

        #iframe-container.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responsive adjustments */
        @media (max-width: 375px) {
            .header {
                padding: 48px 20px 28px;
            }

            .app-title {
                font-size: 24px;
            }

            .logo {
                width: 36px;
                height: 36px;
            }

            .content {
                padding: 0 12px 28px;
            }

            .lesson-card {
                padding: 10px;
                gap: 14px;
            }

            .lesson-image {
                width: 76px;
                height: 76px;
            }

            .lesson-title {
                font-size: 15px;
            }

            .lesson-subtitle {
                font-size: 12px;
            }
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 480px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="menu">
        <div class="header">
            <div class="logo-section">
                <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="4" width="16" height="16" stroke="#ffffff" stroke-width="2"/>
                    <line x1="12" y1="4" x2="12" y2="20" stroke="#ffffff" stroke-width="2"/>
                    <line x1="4" y1="12" x2="20" y2="12" stroke="#ffffff" stroke-width="2"/>
                </svg>
                <h1 class="app-title">Lesona</h1>
            </div>
            <p class="app-subtitle">Sekoly Sabata</p>
        </div>

        <div class="content">
            <h2 class="section-title">Safidio ny kilasy</h2>
            
            <div class="lessons-list">
                <a href="https://sabbath-school.adventech.io/resources/mg/ss/2025-04" class="lesson-card">
                    <img src="images/lehibe.png" alt="" class="lesson-image">
                    <div class="lesson-info">
                        <div class="lesson-title">Lehibe</div>
                        <div class="lesson-subtitle">Olon-dehibe</div>
                    </div>
                    <svg class="lesson-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L15 12L9 6" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>

                <a href="https://sabbath-school.adventech.io/resources/mg/ss/2025-04-cq" class="lesson-card">
                    <img src="images/tanora.png" alt="" class="lesson-image">
                    <div class="lesson-info">
                        <div class="lesson-title">Tanora Zokiny</div>
                        <div class="lesson-subtitle">19-35 taona</div>
                    </div>
                    <svg class="lesson-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L15 12L9 6" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>

                <a href="https://AndilanaSudLesona.github.io/SDA/Zatovo/" class="lesson-card">
                    <img src="images/zatovo.png" alt="" class="lesson-image">
                    <div class="lesson-info">
                        <div class="lesson-title">Zatovo</div>
                        <div class="lesson-subtitle">Tanora zandriny</div>
                    </div>
                    <svg class="lesson-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L15 12L9 6" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <div id="iframe-container">
        <iframe id="lesson-iframe" src=""></iframe>
    </div>

    <script>
        const cards = document.querySelectorAll('.lesson-card');
        const iframeContainer = document.getElementById('iframe-container');
        const iframe = document.getElementById('lesson-iframe');
        const menu = document.getElementById('menu');
        
        cards.forEach(card => {
            card.addEventListener('click', function(e) {
                e.preventDefault();
                
                iframe.src = this.getAttribute('href');
                iframeContainer.classList.add('active');
                menu.style.display = 'none';
                
                history.pushState({page: 'lesson'}, '', '#lesson');
            });
        });
        
        window.addEventListener('popstate', function() {
            if (iframeContainer.classList.contains('active')) {
                iframeContainer.classList.remove('active');
                menu.style.display = 'block';
                iframe.src = '';
            }
        });

        document.addEventListener('keydown', function(e) {
            if (iframeContainer.classList.contains('active') && e.key === 'Escape') {
                history.back();
            }
        });
    </script>
</body>
    </html>
