<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LESONA SEKOLY SABATA</title>
    <style>
        :root {
            --primary: #1e90ff;
            --primary-dark: #0066cc;
            --secondary: #4169e1;
            --secondary-dark: #0047ab;
            --accent: #ff6b6b;
            --accent-dark: #ff4757;
            --dark-bg: #0a0a0a;
            --card-bg: linear-gradient(145deg, #16213e, #0f1419);
            --text-light: #ffffff;
            --text-gray: #b8b8b8;
            --shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            --transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 50%, var(--dark-bg) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            position: relative;
            overflow: hidden;
            touch-action: pan-x pan-y;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .floating-element {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            opacity: 0.1;
            animation: float 20s infinite linear;
        }

        .floating-element:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
        }

        .floating-element:nth-child(3) {
            width: 150px;
            height: 150px;
            top: 50%;
            right: -75px;
            animation-delay: -10s;
        }

        .floating-element:nth-child(4) {
            width: 180px;
            height: 180px;
            bottom: 20%;
            left: -90px;
            animation-delay: -15s;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(50px, 50px) rotate(90deg);
            }
            50% {
                transform: translate(0, 100px) rotate(180deg);
            }
            75% {
                transform: translate(-50px, 50px) rotate(270deg);
            }
        }

        .container {
            background: var(--card-bg);
            border-radius: 30px;
            box-shadow: var(--shadow),
                inset 0 1px 0 rgba(30, 144, 255, 0.2);
            padding: 35px 25px;
            max-width: 650px;
            width: 98%;
            text-align: center;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(30, 144, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: var(--text-light);
            margin-bottom: 15px;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 4px 20px rgba(30, 144, 255, 0.5);
            letter-spacing: 1.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .book-icon {
            width: 36px;
            height: 36px;
            filter: drop-shadow(0 2px 8px rgba(30, 144, 255, 0.6));
        }

        .subtitle {
            color: var(--text-gray);
            margin-bottom: 35px;
            font-size: 17px;
            font-weight: 300;
            letter-spacing: 0.5px;
            position: relative;
        }

        .subtitle::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .menu-btn {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--text-light);
            text-decoration: none;
            border-radius: 24px;
            font-size: 18px;
            font-weight: 700;
            transition: var(--transition);
            box-shadow: 
                0 8px 30px rgba(30, 144, 255, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
            gap: 20px;
        }

        .menu-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }

        .menu-btn:hover::before {
            left: 100%;
        }

        .menu-btn:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 
                0 15px 40px rgba(30, 144, 255, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .menu-btn:active {
            transform: translateY(-2px) scale(1);
        }

        .menu-btn.youth {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%);
            box-shadow: 
                0 8px 30px rgba(65, 105, 225, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .menu-btn.youth:hover {
            box-shadow: 
                0 15px 40px rgba(65, 105, 225, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

          .menu-btn.teens {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        box-shadow: 
            0 8px 30px rgba(30, 144, 255, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .menu-btn.teens:hover {
        box-shadow: 
            0 15px 40px rgba(30, 144, 255, 0.7),
            inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .menu-img {
            width: 110px;
            height: 110px;
            min-width: 110px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }

        .menu-text {
            flex: 1;
            text-align: left;
            line-height: 1.4;
        }

        .btn-icon {
            width: 27px;
            height: 27px;
            margin-right: 14px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        #iframe-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 1000;
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            touch-action: pan-x pan-y;
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(50px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        #iframe-container.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            touch-action: pan-x pan-y;
        }

        @media (max-width: 600px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 30px 20px;
                border-radius: 25px;
                width: 98%;
            }

            h1 {
                font-size: 24px;
                gap: 10px;
            }

            .book-icon {
                width: 30px;
                height: 30px;
            }

            .subtitle {
                font-size: 15px;
                margin-bottom: 30px;
            }

            .menu-btn {
                font-size: 16px;
                padding: 18px;
                gap: 16px;
            }

            .menu-img {
                width: 90px;
                height: 90px;
                min-width: 90px;
                border-radius: 12px;
            }

            .menu-text {
                font-size: 16px;
            }

            .btn-icon {
                width: 23px;
                height: 23px;
                margin-right: 10px;
            }
        }

        html, body {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>
    
    <div class="container" id="menu">
        <h1>
            <svg class="book-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 6.5C10.5 4.5 8.5 3.5 6 3.5C4.5 3.5 3.5 4 2.5 5V18.5C3.5 17.5 4.5 17 6 17C8.5 17 10.5 18 12 20C13.5 18 15.5 17 18 17C19.5 17 20.5 17.5 21.5 18.5V5C20.5 4 19.5 3.5 18 3.5C15.5 3.5 13.5 4.5 12 6.5Z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 6.5V20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Lesona Sekoly Sabata
        </h1>
        <p class="subtitle">Safidio ny lesona mifanaraka amin'ny taonanao</p>
        
        <div class="menu-grid">
            <a href="https://sabbath-school.adventech.io/resources/mg/ss/2025-04" class="menu-btn">
                <img src="images/lehibe.png" alt="Lehibe" class="menu-img">
                <span class="menu-text">LESONA HO AN'NY LEHIBE</span>
            </a>
            
            <a href="https://sabbath-school.adventech.io/resources/mg/ss/2025-04-cq" class="menu-btn youth">
                <img src="images/tanora.png" alt="Tanora" class="menu-img">
                <span class="menu-text">LESONA HO AN'NY TANORA ZOKINY</span>
            </a>
            
            <a href="https://AndilanaSudLesona.github.io/SDA/Zatovo/" class="menu-btn teens">
                <img src="images/zatovo.png" alt="Zatovo" class="menu-img">
                <span class="menu-text">LESONA HO AN'NY ZATOVO</span>
            </a>
        </div>
    </div>

    <div id="iframe-container">
        <iframe id="lesson-iframe" src="" allow="geolocation; microphone; camera"></iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuButtons = document.querySelectorAll('.menu-btn');
            const iframeContainer = document.getElementById('iframe-container');
            const lessonIframe = document.getElementById('lesson-iframe');
            const menu = document.getElementById('menu');
            
            menuButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    const url = this.getAttribute('href');
                    
                    lessonIframe.src = url;
                    
                    iframeContainer.classList.add('active');
                    menu.style.display = 'none';
                    document.body.style.overflow = 'hidden';
                    
                    // Add to history for back button
                    history.pushState({page: 'iframe'}, '', '#lesson');
                    
                    // Inject CSS to hide header after iframe loads
                    lessonIframe.onload = function() {
                        try {
                            const iframeDoc = lessonIframe.contentDocument || lessonIframe.contentWindow.document;
                            const style = iframeDoc.createElement('style');
                            style.textContent = `
                                header,
                                nav[role="navigation"],
                                [class*="header"],
                                [class*="Header"],
                                [class*="navbar"],
                                [class*="Navbar"],
                                [class*="menu-top"],
                                .ss-header,
                                #header,
                                .site-header,
                                [class*="logo"],
                                [class*="Logo"],
                                h1:first-of-type,
                                .title-section,
                                div:has(> img[alt*="Sabbath"]),
                                div:has(> img[alt*="sabbath"]),
                                body > div:first-child > div:first-child,
                                body > header:first-of-type,
                                body > nav:first-of-type {
                                    display: none !important;
                                    visibility: hidden !important;
                                    height: 0 !important;
                                    overflow: hidden !important;
                                }
                                
                                body, main, #main, .main-content, [role="main"] {
                                    padding-top: 0 !important;
                                    margin-top: 0 !important;
                                }
                                
                                html, body {
                                    height: 100% !important;
                                    overflow-y: auto !important;
                                }
                            `;
                            iframeDoc.head.appendChild(style);
                        } catch (e) {
                            console.log('Cannot inject CSS due to CORS policy');
                        }
                    };
                });
            });
            
            // Back button handling
            window.addEventListener('popstate', function(e) {
                if (iframeContainer.classList.contains('active')) {
                    iframeContainer.classList.remove('active');
                    menu.style.display = 'flex';
                    lessonIframe.src = '';
                    document.body.style.overflow = 'auto';
                }
            });

            // Prevent zoom on iframe
            document.addEventListener('wheel', function(e) {
                if (iframeContainer.classList.contains('active') && e.ctrlKey) {
                    e.preventDefault();
                }
            }, { passive: false });

            document.addEventListener('touchmove', function(e) {
                if (iframeContainer.classList.contains('active') && e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });

            document.addEventListener('keydown', function(e) {
                if (iframeContainer.classList.contains('active')) {
                    // Prevent zoom
                    if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=')) {
                        e.preventDefault();
                    }
                    
                    // Back with Escape key
                    if (e.key === 'Escape') {
                        iframeContainer.classList.remove('active');
                        menu.style.display = 'flex';
                        lessonIframe.src = '';
                        document.body.style.overflow = 'auto';
                    }
                }
            });
        });
    </script>
</body>
            </html>
