<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Lesona</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Lora', serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Content */
        .content {
            flex: 1;
            padding: 72px 16px 32px;
        }

        .lessons-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .lesson-card {
            background: #000000;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 16px;
            text-decoration: none;
            transition: transform 0.15s ease, opacity 0.15s ease;
            cursor: pointer;
        }

        .lesson-card:active {
            transform: scale(0.97);
            opacity: 0.6;
        }

        .lesson-image {
            width: 120px;
            height: 120px;
            object-fit: cover;
            flex-shrink: 0;
            background: #111111;
            border-radius: 16px;
        }

        .lesson-info {
            flex: 1;
            min-width: 0;
        }

        .lesson-title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            line-height: 1.3;
            font-family: 'Lora', serif;
        }

        .lesson-arrow {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            opacity: 0.4;
        }

        /* Iframe Container */
        #iframe-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 9999;
        }

        #iframe-container.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Responsive adjustments */
        @media (max-width: 375px) {
            .content {
                padding: 64px 12px 28px;
            }

            .lesson-card {
                padding: 14px;
                gap: 16px;
            }

            .lesson-image {
                width: 104px;
                height: 104px;
                border-radius: 14px;
            }

            .lesson-title {
                font-size: 19px;
            }
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 480px;
                margin: 0 auto;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="menu">
        <div class="header">
            <img src="images/logosda.png" alt="" class="logo-sda">
        </div>

        <div class="content">
            <div class="lessons-list">
                <a href="https://sabbath-school.adventech.io/resources/mg/ss/2025-04" class="lesson-card">
                    <img src="images/lehibe.png" alt="" class="lesson-image">
                    <div class="lesson-info">
                        <div class="lesson-title">LEHIBE</div>
                    </div>
                    <svg class="lesson-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L15 12L9 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>

                <a href="https://sabbath-school.adventech.io/resources/mg/ss/2025-04-cq" class="lesson-card">
                    <img src="images/tanora.png" alt="" class="lesson-image">
                    <div class="lesson-info">
                        <div class="lesson-title">TANORA ZOKINY</div>
                    </div>
                    <svg class="lesson-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L15 12L9 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>

                <a href="https://AndilanaSudLesona.github.io/SDA/Zatovo/" class="lesson-card">
                    <img src="images/zatovo.png" alt="" class="lesson-image">
                    <div class="lesson-info">
                        <div class="lesson-title">ZATOVO</div>
                    </div>
                    <svg class="lesson-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9 18L15 12L9 6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <div id="iframe-container">
        <iframe id="lesson-iframe" src=""></iframe>
    </div>

    <script>
        const cards = document.querySelectorAll('.lesson-card');
        const iframeContainer = document.getElementById('iframe-container');
        const iframe = document.getElementById('lesson-iframe');
        const menu = document.getElementById('menu');
        
        cards.forEach(card => {
            card.addEventListener('click', function(e) {
                e.preventDefault();
                
                iframe.src = this.getAttribute('href');
                iframeContainer.classList.add('active');
                menu.style.display = 'none';
                
                history.pushState({page: 'lesson'}, '', '#lesson');
            });
        });
        
        window.addEventListener('popstate', function() {
            if (iframeContainer.classList.contains('active')) {
                iframeContainer.classList.remove('active');
                menu.style.display = 'block';
                iframe.src = '';
            }
        });

        document.addEventListener('keydown', function(e) {
            if (iframeContainer.classList.contains('active') && e.key === 'Escape') {
                history.back();
            }
        });
    </script>
</body>
</html>
