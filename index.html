<!DOCTYPE html>
<html lang="mg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LESONA SEKOLY SABATA</title>
    <style>
        :root {
            --primary: #1e90ff;
            --primary-dark: #0066cc;
            --secondary: #4169e1;
            --dark-bg: #0a0a0a;
            --text-light: #ffffff;
            --text-gray: #b8b8b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            touch-action: pan-x pan-y;
        }

        /* Simplified background - 2 elements only */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .floating-element {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            will-change: transform;
        }

        .floating-element:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 60%);
            animation: float1 25s infinite ease-in-out;
        }

        .floating-element:nth-child(2) {
            width: 250px;
            height: 250px;
            bottom: -125px;
            right: -125px;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 60%);
            animation: float2 30s infinite ease-in-out;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, 60px); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-40px, -60px); }
        }

        .container {
            background: linear-gradient(145deg, #16213e, #0f1419);
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            padding: 35px 25px;
            max-width: 650px;
            width: 98%;
            text-align: center;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(30, 144, 255, 0.2);
        }

        h1 {
            color: var(--text-light);
            margin-bottom: 15px;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .book-icon {
            width: 36px;
            height: 36px;
        }

        .subtitle {
            color: var(--text-gray);
            margin-bottom: 35px;
            font-size: 17px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--text-light);
            text-decoration: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            transition: transform 0.2s ease;
            box-shadow: 0 6px 20px rgba(30, 144, 255, 0.3);
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
            gap: 20px;
            will-change: transform;
        }

        .menu-btn:active {
            transform: scale(0.97);
        }

        .menu-btn.youth {
            background: linear-gradient(135deg, var(--secondary), #0047ab);
            box-shadow: 0 6px 20px rgba(65, 105, 225, 0.3);
        }

        .menu-btn.teens {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            box-shadow: 0 6px 20px rgba(30, 144, 255, 0.3);
        }

        .menu-img {
            width: 110px;
            height: 110px;
            min-width: 110px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .menu-text {
            flex: 1;
            text-align: left;
            line-height: 1.4;
        }

        #iframe-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            z-index: 1000;
            touch-action: pan-x pan-y;
        }

        #iframe-container.active {
            display: block;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            touch-action: pan-x pan-y;
        }

        @media (max-width: 600px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 30px 20px;
                border-radius: 25px;
            }

            h1 {
                font-size: 24px;
                gap: 10px;
            }

            .book-icon {
                width: 30px;
                height: 30px;
            }

            .subtitle {
                font-size: 15px;
                margin-bottom: 30px;
            }

            .menu-btn {
                font-size: 16px;
                padding: 18px;
                gap: 16px;
                border-radius: 16px;
            }

            .menu-img {
                width: 90px;
                height: 90px;
                min-width: 90px;
                border-radius: 12px;
            }
        }

        html, body {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>
    
    <div class="container" id="menu">
        <h1>
            <svg class="book-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 6.5C10.5 4.5 8.5 3.5 6 3.5C4.5 3.5 3.5 4 2.5 5V18.5C3.5 17.5 4.5 17 6 17C8.5 17 10.5 18 12 20C13.5 18 15.5 17 18 17C19.5 17 20.5 17.5 21.5 18.5V5C20.5 4 19.5 3.5 18 3.5C15.5 3.5 13.5 4.5 12 6.5Z" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
                <path d="M12 6.5V20" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            Lesona Sekoly Sabata
        </h1>
        <p class="subtitle">Safidio ny lesona mifanaraka amin'ny taonanao</p>
        
        <div class="menu-grid">
            <a href="https://sabbath-school.adventech.io/resources/mg/ss/2025-04" class="menu-btn">
                <img src="images/lehibe.png" alt="Lehibe" class="menu-img">
                <span class="menu-text">LESONA HO AN'NY LEHIBE</span>
            </a>
            
            <a href="https://sabbath-school.adventech.io/resources/mg/ss/2025-04-cq" class="menu-btn youth">
                <img src="images/tanora.png" alt="Tanora" class="menu-img">
                <span class="menu-text">LESONA HO AN'NY TANORA ZOKINY</span>
            </a>
            
            <a href="https://AndilanaSudLesona.github.io/SDA/Zatovo/" class="menu-btn teens">
                <img src="images/zatovo.png" alt="Zatovo" class="menu-img">
                <span class="menu-text">LESONA HO AN'NY ZATOVO</span>
            </a>
        </div>
    </div>

    <div id="iframe-container">
        <iframe id="lesson-iframe" src=""></iframe>
    </div>

    <script>
        const menuButtons = document.querySelectorAll('.menu-btn');
        const iframeContainer = document.getElementById('iframe-container');
        const lessonIframe = document.getElementById('lesson-iframe');
        const menu = document.getElementById('menu');
        
        menuButtons.forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                
                lessonIframe.src = this.getAttribute('href');
                iframeContainer.classList.add('active');
                menu.style.display = 'none';
                
                history.pushState({page: 'iframe'}, '', '#lesson');
            });
        });
        
        window.addEventListener('popstate', function() {
            if (iframeContainer.classList.contains('active')) {
                iframeContainer.classList.remove('active');
                menu.style.display = 'flex';
                lessonIframe.src = '';
            }
        });

        document.addEventListener('keydown', function(e) {
            if (iframeContainer.classList.contains('active') && e.key === 'Escape') {
                iframeContainer.classList.remove('active');
                menu.style.display = 'flex';
                lessonIframe.src = '';
            }
        });
    </script>
</body>
        </html>
